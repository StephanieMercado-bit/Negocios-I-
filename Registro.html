<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Env&Star</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="inicio.html" class="logo-container">
            <img src="img/Logo.png" alt="Logo"> Env&Star
        </a>
        <ul>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <main>
        <section class="tarjeta-seccion" style="max-width: 450px;">
            <h2>Crear Cuenta</h2>
            <form id="formRegistro">
                <input type="text" id="reg-nombre" placeholder="Ej. Estrella Mercado">
                <input type="email" id="reg-correo" placeholder="Correo electrónico">
                <input type="password" placeholder="Contraseña">
                <input type="password" placeholder="Confirmar Contraseña">
                <button type="submit" class="btn">Registrarme</button>
            </form>
            
            <p style="margin-top: 25px;">¿Ya tienes cuenta? <a href="login.html" style="color: var(--color-principal); font-weight: bold; text-decoration: none;">Inicia sesión</a></p>
        </section>
    </main>

    <!-- Modal Alerta Personalizada -->
    <div id="customAlert" class="modal-overlay">
        <div class="modal-box" style="max-width: 350px;">
            <h3 id="alertTitulo" style="color: var(--color-principal); margin-bottom: 15px;">Aviso</h3>
            <p id="alertMensaje" style="margin-bottom: 20px; line-height: 1.5;">Mensaje</p>
            <button class="btn" onclick="cerrarAlerta()">Aceptar</button>
        </div>
    </div>

    <!-- Tu Footer aquí -->

    <script>
        function mostrarAlerta(mensaje, titulo = 'Aviso', accion = null) {
            document.getElementById('alertTitulo').innerText = titulo;
            document.getElementById('alertMensaje').innerText = mensaje;
            document.getElementById('customAlert').style.display = 'flex';
            window.accionPostAlerta = accion;
        }

        function cerrarAlerta() {
            document.getElementById('customAlert').style.display = 'none';
            if (window.accionPostAlerta) {
                window.accionPostAlerta();
                window.accionPostAlerta = null;
            }
        }

        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-nombre').value;
            const correo = document.getElementById('reg-correo').value;
            
            // Guardamos los datos simulados
            localStorage.setItem('envStarUser', nombre);
            localStorage.setItem('envStarCorreo', correo);

            mostrarAlerta('Tu cuenta ha sido creada exitosamente. Ahora puedes iniciar sesión.', '¡Registro Exitoso!', () => {
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
