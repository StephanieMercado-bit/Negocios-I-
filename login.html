<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Env&Star</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="inicio.html" class="logo-container">
            <img src="img/Logo.png" alt="Logo"> Env&Star
        </a>
        <ul>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <main>
        <section class="tarjeta-seccion" style="max-width: 450px;">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <input type="email" placeholder="Correo electrónico">
                <input type="password" placeholder="Contraseña">
                
                <!-- Enlace de contraseña olvidada -->
                <div style="text-align: right; margin-top: -5px;">
                    <a href="#" onclick="mostrarAlerta('Te hemos enviado un enlace a tu correo para restablecer tu contraseña.', 
                    'Recuperar contraseña')" style="font-size: 0.9rem; color: var(--color-principal);
                     text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn">Entrar</button>
            </form>
            
            <p style="margin-top: 25px;">¿No tienes cuenta? <a href="registro.html" style="color: var(--color-principal); font-weight: bold; text-decoration: none;">Regístrate aquí</a></p>
        </section>
    </main>

    <!-- Modal Alerta Personalizada -->
    <div id="customAlert" class="modal-overlay">
        <div class="modal-box" style="max-width: 350px;">
            <h3 id="alertTitulo" style="color: var(--color-principal); margin-bottom: 15px;">Aviso</h3>
            <p id="alertMensaje" style="margin-bottom: 20px; line-height: 1.5;">Mensaje</p>
            <button class="btn" onclick="cerrarAlerta()">Aceptar</button>
        </div>
    </div>

    <!-- Tu Footer aquí -->

    <script>
        // Lógica del modal personalizado
        function mostrarAlerta(mensaje, titulo = 'Aviso', accion = null) {
            document.getElementById('alertTitulo').innerText = titulo;
            document.getElementById('alertMensaje').innerText = mensaje;
            document.getElementById('customAlert').style.display = 'flex';
            window.accionPostAlerta = accion; // Guarda la acción (ej. redirigir) para ejecutarla al cerrar
        }

        function cerrarAlerta() {
            document.getElementById('customAlert').style.display = 'none';
            if (window.accionPostAlerta) {
                window.accionPostAlerta();
                window.accionPostAlerta = null;
            }
        }

        // Simulación de Login
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            mostrarAlerta('¡Inicio de sesión exitoso!', 'Bienvenido', () => {
                window.location.href = 'perfil.html';
            });
        });
    </script>
</body>
</html>
