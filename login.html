<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Env&Star</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="inicio.html" class="logo-container">
            <img src="img/Logo.png" alt="Logo"> Env&Star
        </a>
        <ul>
            <li><a href="inicio.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="login.html">Iniciar sesión</a></li>
        </ul>
    </nav>

    <main style="display: flex; gap: 20px; flex-wrap: wrap;">
        <!-- Iniciar Sesión -->
        <section class="tarjeta-seccion" style="flex: 1; min-width: 300px;">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <input type="email" placeholder="Correo electrónico">
                <input type="password" placeholder="Contraseña">
                <button type="submit" class="btn">Entrar</button>
            </form>
        </section>

    </main>

    <script>
        // Login simulado
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'perfil.html';
        });
    </script>
</body>
</html>
