<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos | Env&Star</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center; align-items: center; background: linear-gradient(rgba(250, 212, 212, 0.9), rgba(250, 212, 212, 0.9)), url('img/manualidad2.jpeg') center/cover;">

    <main style="width: 100%; display: flex; justify-content: center; padding: 20px;">
        <section class="tarjeta-seccion" style="max-width: 500px; padding: 50px 30px;">
            <img src="img/Logo.png" alt="Env&Star Logo" style="max-width: 180px; margin-bottom: 20px;">
            <h1 style="font-size: 2rem; margin-bottom: 10px;">¡Descubre el regalo perfecto!</h1>
            <p>Ingresa tu correo para acceder a nuestro catálogo exclusivo y recibir ofertas especiales antes que nadie.</p>
            
            <form id="formMarketing" style="margin-top: 25px;">
                <input type="email" id="correoMarketing" placeholder="Tu mejor correo electrónico" required style="padding: 15px; font-size: 1.1rem; text-align: center;">
                <button type="submit" class="btn" style="padding: 15px; font-size: 1.1rem;">Entrar a la tienda</button>
            </form>
            
            <p style="font-size: 0.8rem; margin-top: 20px; color: #666;">No enviaremos spam, lo prometemos.</p>
        </section>
    </main>

    <script>
        document.getElementById('formMarketing').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue
            
            // Opcional: Aquí podrías guardar el correo en localStorage si lo necesitas después
            const correo = document.getElementById('correoMarketing').value;
            localStorage.setItem('leadCorreo', correo);
            
            // Redirigir a la tienda real
            window.location.href = 'inicio.html';
        });
    </script>
</body>
</html>
